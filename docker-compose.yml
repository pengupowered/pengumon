# Linux host deployment (rootless Podman with podman-compose, or Docker):
#   podman-compose up -d --build
# First: cp config.example.yaml config.yaml (git-ignored). It holds only the listen address, port, database path, probe
# interval and the one-time first import; all other settings are on the dashboard's Settings page.
# Settings come from .env next to this file (git-ignored; see .env.example). Empty values count as unset.
#
# Host networking, so probes and traceroute measure this machine's own path with no proxy in between.
# Under rootless Podman a raw ICMP socket isn't permitted on the host network; the prober then uses
# an unprivileged ping socket, which needs net.ipv4.ping_group_range to cover the user's group
# (e.g. /etc/sysctl.d/60-unprivileged-ping.conf: net.ipv4.ping_group_range = 0 2147483647).
# NET_RAW stays because the image's Python carries cap_net_raw as a file capability, and a binary
# with a file capability outside the bounding set can't be executed.
#
# restart: always, because podman-restart.service (systemctl --user enable podman-restart.service)
# only restarts containers with that policy after a reboot.
services:
  pengumon:
    build: .
    image: localhost/pengumon:latest
    container_name: pengumon
    restart: always
    network_mode: host
    cap_add:
      - NET_RAW
    # The root filesystem is read-only; the app writes only to the data volume and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pengumon_data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      # Machine-specific mounts (e.g. a private CA for an HTTPS health endpoint under service_checks, with
      # ca_file: /app/certs/home-ca.pem) go in docker-compose.override.yml, which podman-compose and docker compose
      # merge in automatically and git ignores; see docker-compose.override.example.yml.
    environment:
      - PENGUMON_HOST=0.0.0.0
      - PENGUMON_PORT=8000
      # The host's time zone (e.g. America/New_York), the zone Settings starts with: quiet hours, the daily route check
      # and the reports' days follow it. Empty keeps the image's UTC. scripts/deploy.sh sets it from the host.
      - TZ=${TZ:-}
      - PENGUMON_ACCESS_TOKEN=${PENGUMON_ACCESS_TOKEN:-}
      - PENGUMON_ALLOWED_HOSTS=${PENGUMON_ALLOWED_HOSTS:-}
      - PENGUMON_SESSION_MAX_AGE_DAYS=${PENGUMON_SESSION_MAX_AGE_DAYS:-}
      - PENGUMON_VIEW_WITHOUT_TOKEN=${PENGUMON_VIEW_WITHOUT_TOKEN:-}
      # HTTPS with your own certificate: paths inside the container (mount the files, read-only, in an override file)
      - PENGUMON_TLS_CERT=${PENGUMON_TLS_CERT:-}
      - PENGUMON_TLS_KEY=${PENGUMON_TLS_KEY:-}
      - PENGUMON_NOTIFY_URL=${PENGUMON_NOTIFY_URL:-}
      - PENGUMON_NOTIFY_TOKEN=${PENGUMON_NOTIFY_TOKEN:-}
      # OpenTelemetry export (empty: none). This container uses the host network, so a collector on the same host is
      # http://127.0.0.1:4318. PENGUMON_GRAFANA_URL adds links to the telemetry in the page header.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-pengumon}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
      - PENGUMON_GRAFANA_URL=${PENGUMON_GRAFANA_URL:-}
      # Credentials of the devices set up on the Settings page (PENGUMON_DEVICE_<ID>_*); unset, the dashboard's are used
      - PENGUMON_DEVICE_MODEM_USERNAME=${PENGUMON_DEVICE_MODEM_USERNAME:-}
      - PENGUMON_DEVICE_MODEM_PASSWORD=${PENGUMON_DEVICE_MODEM_PASSWORD:-}
      - PENGUMON_DEVICE_ROUTER_USERNAME=${PENGUMON_DEVICE_ROUTER_USERNAME:-}
      - PENGUMON_DEVICE_ROUTER_PASSWORD=${PENGUMON_DEVICE_ROUTER_PASSWORD:-}
    # No container healthcheck: rootless podman runs them as systemd timers and nothing read their status.
    # scripts/deploy.sh checks /api/health itself.

volumes:
  pengumon_data:
    driver: local
