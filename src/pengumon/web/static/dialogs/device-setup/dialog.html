<!-- Device setup: one sign-in form for every device, opened with the device's id (device-setup.js) -->
<div class="modal" id="deviceSetupModal" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
  <div class="modal-content" style="--w: 560px">
    <header class="modal-h"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg><h2 class="modal-t" id="setupTitle">Set up</h2><span class="modal-m" id="setupMeta"></span>
      <button type="button" class="btn icon m-close" data-action="closeModal" data-arg="deviceSetupModal" aria-label="Close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button></header>
    <form id="deviceSetupForm" data-submit="saveDeviceCredentials" data-needs-edit>
      <div class="modal-b"><div class="form">
        <div class="empty st st-crit compact" id="setupError" hidden></div>
        <p class="lead-p" id="setupLead"></p>
        <div class="field"><label for="setupAddress">Address</label><input class="input mono" id="setupAddress" readonly><span class="hint" id="setupAddressHint"></span></div>
        <div class="field"><label for="setupUsername">Username</label><input class="input" type="text" id="setupUsername" value="admin" autocomplete="username"></div>
        <div class="field"><label for="setupPassword">Password</label><div class="input-wrap"><input class="input" type="password" id="setupPassword" placeholder="Admin password" required autocomplete="current-password" spellcheck="false">
          <button type="button" class="btn icon sm" id="btnShowPassword" data-action="toggleSetupPassword" aria-label="Show password"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg></button></div></div>
        <details class="setup-src"><summary class="fine">For containers and scripts</summary><p class="fine" id="setupSource"></p></details>
        <div id="setupResult" role="status" aria-live="polite"></div>
      </div></div>
      <footer class="modal-f"><button type="button" class="btn" data-action="closeModal" data-arg="deviceSetupModal">Cancel</button>
        <button type="submit" class="btn primary" id="btnSaveSetup"><svg class="i" aria-hidden="true"><use href="#i-lock"/></svg><span>Test and save</span></button></footer>
    </form>
  </div>
</div>
