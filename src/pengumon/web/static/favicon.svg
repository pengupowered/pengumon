<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="brow" x1="16" y1="24" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="beak" x1="32" y1="35" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Dark Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>

  <!-- Smooth Penguin Head Base -->
  <path d="M16 32C16 20.954 23.163 14 32 14C40.837 14 48 20.954 48 32V50C48 52.209 46.209 54 44 54H20C17.791 54 16 52.209 16 50V32Z" fill="#090D12"/>

  <!-- White Chin / Chest Patch -->
  <path d="M22 44C22 39 26.5 37 32 37C37.5 37 42 39 42 44V54H22V44Z" fill="#E6EDF3"/>

  <!-- Clean Knit Beanie Cap (No tufts sticking out of hat) -->
  <path d="M17 24C17 15.5 23.5 10 32 10C40.5 10 47 15.5 47 24H17Z" fill="#27272A"/>
  <rect x="15" y="19.5" width="34" height="5.5" rx="2.75" fill="#3F3F46" stroke="#18181B" stroke-width="1.5"/>

  <!-- Natural Golden Eyebrows on the Face (above glasses, below beanie brim) -->
  <path d="M30 29L18 24.5L15 26.5L27 30.5Z" fill="url(#brow)"/>
  <path d="M34 29L46 24.5L49 26.5L37 30.5Z" fill="url(#brow)"/>

  <!-- Cyan-Lit Developer Glasses Frames -->
  <rect x="15" y="28" width="14" height="11" rx="3.5" fill="#0D2530" stroke="#38BDF8" stroke-width="2.5"/>
  <rect x="35" y="28" width="14" height="11" rx="3.5" fill="#0D2530" stroke="#38BDF8" stroke-width="2.5"/>
  <path d="M29 32H35" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glowing Monitor Reflection in Lenses -->
  <path d="M18 31H23" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M38 31H43" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sharp Beak -->
  <path d="M26 39L38 39L32 49Z" fill="url(#beak)" stroke="#090D12" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
