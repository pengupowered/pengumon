<!-- Speed: the scheduled speed test's last result, its history and a Run now button (config: speedtest; model.js, view.js) -->
<section data-panel="speed" aria-label="Speed">
  <article class="panel" data-size="4" id="speedCard" data-status="unknown">
    <header class="panel-h"><svg class="i" aria-hidden="true"><use href="#i-gauge"/></svg><h2 class="panel-t">Speed</h2><span class="panel-m" id="speedSummary">loading...</span></header>
    <div class="panel-b"><div class="spd" id="speedBody"></div></div>
    <footer class="panel-f"><svg class="i sm" aria-hidden="true"><use href="#i-clock"/></svg><span id="speedFoot">updates every minute</span></footer>
  </article>
</section>
