[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pengumon"
dynamic = ["version"]
description = "Containerized network diagnostics, hop-by-hop latency tracker, and outage root-cause classifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=13.0",
    "dnspython>=2.6.1",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    'tzdata>=2024.1; sys_platform == "win32"',
    # SNMPv3 privacy (snmp driver): the same pins as requirements.in
    "cryptography==50.0.2",
    'cffi==2.1.1; platform_python_implementation != "PyPy"',
    'pycparser==3.11; platform_python_implementation != "PyPy" and implementation_name != "PyPy"'
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.6",
    "pytest-xdist>=3.6.1"
]

[project.scripts]
pengumon = "pengumon.cli:main"

# Same command without a console window (Windows; elsewhere an ordinary script): what the logon task starts.
[project.gui-scripts]
pengumonw = "pengumon.cli:main"

[tool.setuptools.dynamic]
# The single source of the version (the tests run from src/ without installing, so metadata cannot be it).
version = {attr = "pengumon.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

# Everything read at run time that is not a .py file: the dashboard (HTML, CSS, JS, panel manifests, icons, the
# vendored Chart.js) and the page templates. tests/test_wheel.py builds the wheel and checks it is all there.
[tool.setuptools.package-data]
pengumon = ["web/static/**/*", "web/templates/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# A test still running after this many seconds is stuck: pytest prints every thread's stack and ends the run, instead of
# letting it loop (and grow) until someone notices. The slowest test takes about 9 s; scripts/test-ui.sh allows 300.
faulthandler_timeout = 60
faulthandler_exit_on_timeout = true

